version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: devflow-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devflow
    ports:
      - "5432:5432"
    volumes:
      - devflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devflow-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/devflow?schema=public"
      JWT_ACCESS_SECRET: "devflow_jwt_access_secret_super_secure_key_2026"
      JWT_REFRESH_SECRET: "devflow_jwt_refresh_secret_super_secure_key_2026"
      JWT_ACCESS_EXPIRY: "15m"
      JWT_REFRESH_EXPIRY: "7d"
      CORS_ORIGIN: "http://localhost:5173"
      OPENAI_API_KEY: ""
    depends_on:
      db:
        condition: service_healthy

volumes:
  devflow_pgdata:
